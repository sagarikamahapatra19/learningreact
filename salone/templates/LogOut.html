{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logout</title>
  <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
</head>
<body>
  <div class="container-form">
    <div class="form-box">
      <h2>Logout</h2>
      <form method="POST" action="{% url 'LogOut' %}">
         {% csrf_token %}
      <p>Successfully logged out.</p>
      <button id="logoutBtn" class="btn-form"><a href="{% url 'LogIn' %}">Go to Login</a></button>
      </form>
    </div>
  </div>
  <script>
    setTimeout(function() {
    window.location.href = "{% url 'LogIn' %}";
  }, 1000);
  </script>
</body>
</html>
