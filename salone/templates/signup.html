{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="{% static 'CSS/style.css' %}">
    <!-- Font Awesome for eye icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
 <div class="container-form">
    <div class="form-box" id="loginBox">
      <h2>Sign Up</h2>
      <form id="signupForm" method="POST" action="{% url 'signup' %}">
        {% csrf_token %}
        <div class="input-group">
          <input type="email" placeholder="Email" name="email" required>
        </div>
        <div class="input-group">
          <input type="text" placeholder="Username" name="username">
        </div>
        <div class="input-group password-group">
          <input type="password" id="signupPassword" placeholder="Password" name="password" required>
        </div>
        <button type="submit" class="btn-form">CREATE ACCOUNT</button>
        <div class="links-form">
          <span>
            Already have an account? 
            <a href="{% url 'LogIn' %}" id="showLogin">Login</a>
          </span>
        </div>
      </form>
    </div>
  </div>
 <script src="{% static 'JavaScript/app.js' %}"></script>
</body>
</html>
